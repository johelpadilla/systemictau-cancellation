[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "systemictau-cancellation"
version = "0.1.0"
description = "Cancellation channel beside signed Systemic Tau: D = |mean change| + C"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Johel Padilla-Villanueva", email = "joel.padilla2@upr.edu"},
]
keywords = ["kendall-tau", "systemic-tau", "concordance", "cancellation", "time-series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/johelpadilla/systemictau-cancellation"
Source = "https://github.com/johelpadilla/systemictau-cancellation"
Note = "https://doi.org/10.5281/zenodo.23073069"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
